services:
  web:
    image: ghcr.io/df3mt/log4om-web:latest
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Must reach the API container/service from inside the web container
      API_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
