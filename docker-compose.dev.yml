services:
  web:
    build:
      context: .
      args:
        API_URL: http://host.docker.internal:8080
        NEXT_PUBLIC_API_URL: http://host.docker.internal:8080
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      # Used if you rebuild; rewrites are resolved at build time
      API_URL: http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
